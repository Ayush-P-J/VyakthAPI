<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connect your Tally</title>
<style>
  :root {
    --paper: #EEF2F4; --ink: #1A1F2E; --bank: #16235C; --margin: #C2182B; --rule: #B9CBDD; --quiet: #55607A;
    --row: 2.75rem; --gutter: 4.25rem;
  }
  * { box-sizing: border-box; }
  html { background: #D9E1E7; }
  body { margin: 0; color: var(--ink); font: 400 1rem/1.5 "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans", sans-serif; }
  .page {
    max-width: 46rem; min-height: 100vh; margin: 0 auto; padding: 2.75rem 1.5rem 4rem var(--gutter); position: relative; background-color: var(--paper);
    background-image: linear-gradient(to right, transparent calc(var(--gutter) - .9rem), var(--margin) calc(var(--gutter) - .9rem), var(--margin) calc(var(--gutter) - .8rem), transparent calc(var(--gutter) - .8rem), transparent calc(var(--gutter) - .65rem), var(--margin) calc(var(--gutter) - .65rem), var(--margin) calc(var(--gutter) - .55rem), transparent calc(var(--gutter) - .55rem));
  }
  h1, h2 { font-family: Cambria, "Noto Serif", Georgia, serif; color: var(--bank); font-weight: 700; margin: 0; }
  h1 { font-size: clamp(1.75rem, 5vw, 2.5rem); line-height: 1.15; max-width: 22ch; overflow-wrap: anywhere; }
  h2 { font-size: 1.25rem; line-height: 1.3; }
  p { margin: .5rem 0 0; max-width: 62ch; }
  .lede { margin-top: .875rem; color: var(--quiet); }
  section { position: relative; margin-top: 2.5rem; }
  .serial { position: absolute; left: calc(-1 * var(--gutter) + .25rem); top: -.05rem; width: 2.4rem; text-align: right; font: 700 1.25rem/1.3 Cambria, "Noto Serif", Georgia, serif; color: var(--margin); }
  section.idle { opacity: .5; }
  code { display: block; margin-top: .75rem; padding: .625rem .75rem; background: #fff; border: 1px solid var(--rule); font: .875rem/1.4 Consolas, "Cascadia Mono", monospace; overflow-wrap: anywhere; }
  .waiting { display: flex; gap: .625rem; align-items: center; margin-top: .875rem; color: var(--quiet); }
  .dot { width: .625rem; height: .625rem; border-radius: 50%; background: var(--margin); animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  ul.ledger { list-style: none; margin: .875rem 0 0; padding: 0; border-top: 1px solid var(--rule); }
  ul.ledger > li { border-bottom: 1px solid var(--rule); min-height: var(--row); }
  label.company { display: flex; align-items: center; gap: .75rem; min-height: var(--row); cursor: pointer; overflow-wrap: anywhere; }
  label.company input { accent-color: var(--bank); width: 1.1rem; height: 1.1rem; flex: none; }
  .field { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .375rem 1rem; padding: .375rem 0; }
  .field .name { min-width: 11rem; flex: 1; }
  .field small { display: block; color: var(--quiet); font-size: .8125rem; }
  fieldset.choice { border: 0; margin: 0; padding: 0; display: inline-flex; }
  fieldset.choice legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .choice label { cursor: pointer; }
  .choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .choice span { display: block; padding: .3125rem .75rem; font-size: .875rem; color: var(--bank); border: 1px solid var(--bank); margin-left: -1px; background: #fff; transition: background .12s; }
  .choice input:checked + span { background: var(--bank); color: #fff; }
  .choice input.off:checked + span { background: var(--margin); border-color: var(--margin); color: #fff; }
  .choice input:focus-visible + span { outline: 3px solid var(--margin); outline-offset: 2px; }
  .key { margin-top: 1rem; font-size: .875rem; color: var(--quiet); }
  .key b { color: var(--ink); font-weight: 600; }
  button.approve { margin-top: 1.75rem; padding: .75rem 1.5rem; font: 600 1rem "Segoe UI", system-ui, sans-serif; color: #fff; background: var(--bank); border: 0; cursor: pointer; }
  button.approve:hover { background: #0E1A4A; }
  button.approve:focus-visible, label.company input:focus-visible { outline: 3px solid var(--margin); outline-offset: 2px; }
  button.approve:disabled { opacity: .55; cursor: default; }
  .error { margin-top: .875rem; color: var(--margin); font-weight: 600; }
  .fine { margin-top: 1rem; font-size: .875rem; color: var(--quiet); }
  .done { margin-top: 2.5rem; padding-top: .875rem; border-top: 3px double var(--bank); }
  @media (max-width: 34rem) {
    :root { --gutter: 2.75rem; }
    .page { padding-right: 1rem; }
    .serial { width: 1.4rem; left: calc(-1 * var(--gutter) + .1rem); }
    .field { flex-direction: column; align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } .choice span { transition: none; } }
</style>
</head>
<body>
<main class="page" id="app" aria-live="polite"><h1>Connect your Tally</h1><p class="lede">Loading this link.</p></main>
<script>
(function () {
  var token = location.pathname.split("/").pop();
  var app = document.getElementById("app");
  var el = function (tag, props, kids) {
    var n = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) { if (k === "text") n.textContent = props[k]; else if (k in n) n[k] = props[k]; else n.setAttribute(k, props[k]); });
    (kids || []).forEach(function (k) { if (k) n.appendChild(k); });
    return n;
  };
  var words = function (s) { var w = s.replace(/_+$/, "").replace(/([a-z0-9])([A-Z])/g, "$1 $2").toLowerCase(); w = w.replace(/\b(gstin|gst|pan|hsn)\b/g, function (m) { return m.toUpperCase(); }); return w.charAt(0).toUpperCase() + w.slice(1); };
  var NAMES = { incomeTaxNumber: "PAN", gstin: "GSTIN", ledgerMobile: "Mobile number", ledgerPhone: "Phone number", email: "Email address" };
  var label = function (n) { return NAMES[n] || words(n); };
  var view = "", state = null, uid = 0, choices = {}, fallback = "masked";

  function step(n, title, active, kids) {
    return el("section", { className: active ? "" : "idle" }, [el("div", { className: "serial", text: String(n), "aria-hidden": "true" }), el("h2", { text: title })].concat(kids || []));
  }
  function choice(key, title, current) {
    uid++;
    var opt = function (val, text, off) {
      var input = el("input", { type: "radio", name: "c" + uid, value: val, checked: current === val, className: off ? "off" : "" });
      input.addEventListener("change", function () { choices[key] = val; });
      return el("label", {}, [input, el("span", { text: text })]);
    };
    return el("fieldset", { className: "choice" }, [el("legend", { text: title }), opt("public", "Share"), opt("masked", "Hide most"), opt("excluded", "Keep private", true)]);
  }
  function render(s) {
    var name = s.project || "This app";
    if (s.status === "expired") return swap("expired", [el("h1", { text: "This link has expired" }), el("p", { className: "lede", text: "Ask " + name + " to send you a new one. Nothing was connected." })]);
    if (s.status === "connected") {
      var kids = [el("h1", { text: "Your Tally is connected" }), el("div", { className: "done" }, [el("p", { text: name + " can now use the data you approved." }), el("p", { className: "fine", text: "You can stop sharing at any time from the connector on your PC." })])];
      if (s.redirect) { kids.push(el("p", {}, [el("a", { href: s.redirect, text: "Return to " + name })])); setTimeout(function () { location.href = s.redirect; }, 2500); }
      return swap("connected", kids);
    }
    var writes = (s.requestedScopes || []).indexOf("write") >= 0;
    var head = [el("h1", { text: name + " wants to connect to your Tally" }), el("p", { className: "lede", text: writes ? "It asks to read your data and to post entries into your books." : "It asks to read your data. It will not change anything in your books." })];
    if (s.status === "awaiting_connector") {
      return swap("waiting", head.concat([
        step(1, "Start the connector on your Tally PC", true, [el("p", { text: "Open Tally with your company loaded, then give the connector this link code." }), el("code", { text: token }), el("div", { className: "waiting" }, [el("div", { className: "dot" }), el("span", { text: "Waiting for the connector. This page updates by itself." })])]),
        step(2, "Pick a company", false), step(3, "Choose what to share", false),
      ]));
    }
    if (view === "approve") return;
    choices = {};
    (s.requestedFields || []).forEach(function (f) { choices[f.dataset + "." + f.name] = f.suggested; });
    var groups = {};
    (s.standardFields || []).forEach(function (f) { (groups[f.name] = groups[f.name] || { suggested: f.suggested, keys: [] }).keys.push(f.dataset + "." + f.name); });
    Object.keys(groups).forEach(function (n) { groups[n].keys.forEach(function (k) { choices[k] = groups[n].suggested; }); });
    var companies = (s.companies || []).map(function (c, i) {
      return el("li", {}, [el("label", { className: "company" }, [el("input", { type: "radio", name: "company", value: c.guid, checked: i === 0 }), el("span", { text: c.name })])]);
    });
    var rows = (s.requestedFields || []).map(function (f) {
      var k = f.dataset + "." + f.name;
      return el("li", { className: "field" }, [el("div", { className: "name" }, [el("span", { text: label(f.name) }), el("small", { text: "Custom field on " + words(f.dataset).toLowerCase() })]), choice(k, label(f.name), f.suggested)]);
    }).concat(Object.keys(groups).map(function (n) {
      var row = el("li", { className: "field" }, [el("div", { className: "name", text: label(n) }), choice("group:" + n, label(n), groups[n].suggested)]);
      row.querySelectorAll("input").forEach(function (i) { i.addEventListener("change", function () { delete choices["group:" + n]; groups[n].keys.forEach(function (k) { choices[k] = i.value; }); }); });
      return row;
    }));
    uid++;
    var newFields = el("li", { className: "field" }, [el("div", { className: "name" }, [el("span", { text: "Custom fields added later" }), el("small", { text: "If " + name + " asks for more of your custom fields" })]), (function () {
      var c = choice("__default", "Custom fields added later", fallback);
      c.querySelectorAll("input").forEach(function (i) { i.addEventListener("change", function () { fallback = i.value; delete choices.__default; }); });
      return c;
    })()]);
    var err = el("p", { className: "error", role: "alert", hidden: true });
    var btn = el("button", { type: "button", className: "approve", text: "Connect and share" });
    btn.addEventListener("click", function () {
      var picked = document.querySelector("input[name=company]:checked");
      if (!picked) { err.hidden = false; err.textContent = "Pick a company first."; return; }
      btn.disabled = true; err.hidden = true;
      fetch(location.pathname + "/approve", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ companyGuid: picked.value, rules: choices, customDefault: fallback }) })
        .then(function (r) { return r.json().then(function (b) { if (!r.ok) throw new Error(b.error && b.error.message || "This could not be saved. Try again."); }); })
        .then(function () { view = ""; return poll(); })
        .catch(function (e) { btn.disabled = false; err.hidden = false; err.textContent = e.message || "Check your internet connection and try again."; });
    });
    swap("approve", head.concat([
      step(1, "Start the connector on your Tally PC", false, [el("p", { text: "Done. Your connector is ready." })]),
      step(2, "Pick a company", true, [companies.length ? el("ul", { className: "ledger" }, companies) : el("p", { text: "No company is open in Tally. Open one, then restart the connector." })]),
      step(3, "Choose what to share", true, [
        el("p", { text: "Your ledgers, vouchers and stock are shared so the app can work. You decide about the sensitive details below." }),
        el("ul", { className: "ledger" }, rows.concat([newFields])),
        el("p", { className: "key" }, [el("b", { text: "Hide most" }), document.createTextNode(" shows only the last 4 characters. "), el("b", { text: "Keep private" }), document.createTextNode(" means it never leaves your PC.")]),
        btn, err,
        el("p", { className: "fine", text: "You can stop sharing at any time from the connector on your PC." }),
      ]),
    ]));
  }
  function swap(v, kids) { view = v; app.textContent = ""; kids.forEach(function (k) { app.appendChild(k); }); }
  function poll() {
    return fetch(location.pathname + "/state", { cache: "no-store" }).then(function (r) {
      if (!r.ok) { swap("bad", [el("h1", { text: "This link is not valid" }), el("p", { className: "lede", text: "Check that you opened the whole link, or ask for a new one." })]); return null; }
      return r.json();
    }).then(function (s) { if (s) { state = s; render(s); } }).catch(function () {});
  }
  poll();
  setInterval(function () { if (view === "waiting" || view === "") poll(); }, 2000);
})();
</script>
</body>
</html>
