# Postgres alone, published on localhost, for running the tests and the API outside a container.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hexspare
      POSTGRES_PASSWORD: hexspare_dev
      POSTGRES_DB: tally_platform
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexspare -d tally_platform"]
      interval: 2s
      timeout: 3s
      retries: 20
